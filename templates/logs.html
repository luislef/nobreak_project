<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logs de Eventos - UPS Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #e9ecef;
      margin: 0;
      padding: 0;
    }
    .header {
      background-color: #4CAF50;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
    }
    .header a {
      color: white;
      text-decoration: none;
      background-color: rgba(255,255,255,0.2);
      padding: 8px 16px;
      border-radius: 5px;
      transition: background-color 0.3s;
    }
    .header a:hover {
      background-color: rgba(255,255,255,0.3);
    }
    .container {
      max-width: 1400px;
      margin: 20px auto;
      padding: 0 20px;
    }
    .controls {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }
    .controls label {
      font-weight: bold;
      color: #333;
    }
    .controls input[type="date"] {
      padding: 10px 15px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 5px;
      outline: none;
      transition: border-color 0.3s;
    }
    .controls input[type="date"]:focus {
      border-color: #4CAF50;
    }
    .btn {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary {
      background-color: #4CAF50;
      color: white;
    }
    .btn-primary:hover {
      background-color: #45a049;
    }
    .btn-primary:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .btn-secondary {
      background-color: #2196F3;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #1976D2;
    }
    .btn-secondary:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .summary {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
      display: none;
    }
    .summary.visible {
      display: block;
    }
    .summary h2 {
      margin: 0 0 15px 0;
      color: #333;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }
    .summary-item {
      text-align: center;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    .summary-item .value {
      font-size: 28px;
      font-weight: bold;
      color: #4CAF50;
    }
    .summary-item .label {
      font-size: 14px;
      color: #666;
      margin-top: 5px;
    }
    .summary-item.warning .value {
      color: #FF9800;
    }
    .summary-item.error .value {
      color: #f44336;
    }
    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
    }
    .nobreak-card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .nobreak-header {
      padding: 15px 20px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nobreak-header.success {
      background-color: #4CAF50;
    }
    .nobreak-header.no_data {
      background-color: #9E9E9E;
    }
    .nobreak-header.error,
    .nobreak-header.timeout,
    .nobreak-header.offline {
      background-color: #f44336;
    }
    .nobreak-header h3 {
      margin: 0;
      font-size: 16px;
    }
    .nobreak-header .event-count {
      background: rgba(255,255,255,0.2);
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 14px;
    }
    .nobreak-body {
      padding: 15px 20px;
      max-height: 300px;
      overflow-y: auto;
    }
    .nobreak-body.empty {
      text-align: center;
      color: #666;
      padding: 30px;
    }
    .event-item {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .event-item:last-child {
      border-bottom: none;
    }
    .event-time {
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
    }
    .event-description {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .event-code {
      background: #e3f2fd;
      color: #1976D2;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .event-text {
      color: #333;
    }
    .loading {
      display: none;
      text-align: center;
      padding: 40px;
    }
    .loading.visible {
      display: block;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #4CAF50;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .no-results {
      text-align: center;
      padding: 40px;
      color: #666;
      display: none;
    }
    .no-results.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📋 Logs de Eventos dos Nobreaks</h1>
    <a href="/medidores">⚡ Medidores</a>
    <a href="/">← Voltar ao Dashboard</a>
  </div>

  <div class="container">
    <div class="controls">
      <label for="dateInput">Data:</label>
      <input type="date" id="dateInput" value="{{ today }}">
      <button class="btn btn-primary" id="btnFetch" onclick="fetchLogs()">
        🔍 Buscar Logs
      </button>
      <button class="btn btn-secondary" id="btnDownload" onclick="downloadReport()" disabled>
        📥 Baixar Relatório CSV
      </button>
    </div>

    <div class="summary" id="summary">
      <h2>📊 Resumo</h2>
      <div class="summary-grid">
        <div class="summary-item">
          <div class="value" id="totalNobreaks">0</div>
          <div class="label">Nobreaks Consultados</div>
        </div>
        <div class="summary-item">
          <div class="value" id="withData">0</div>
          <div class="label">Com Dados</div>
        </div>
        <div class="summary-item warning">
          <div class="value" id="noData">0</div>
          <div class="label">Sem Dados</div>
        </div>
        <div class="summary-item error">
          <div class="value" id="errors">0</div>
          <div class="label">Erros</div>
        </div>
        <div class="summary-item">
          <div class="value" id="totalEvents">0</div>
          <div class="label">Total de Eventos</div>
        </div>
      </div>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Buscando logs de todos os nobreaks...</p>
    </div>

    <div class="no-results" id="noResults">
      <p>Nenhum resultado encontrado. Selecione uma data e clique em "Buscar Logs".</p>
    </div>

    <div class="results" id="results"></div>
  </div>

  <script>
    let currentDate = '{{ today }}';

    async function fetchLogs() {
      const dateInput = document.getElementById('dateInput');
      currentDate = dateInput.value;

      if (!currentDate) {
        alert('Por favor, selecione uma data.');
        return;
      }

      // Mostra loading
      document.getElementById('loading').classList.add('visible');
      document.getElementById('results').innerHTML = '';
      document.getElementById('summary').classList.remove('visible');
      document.getElementById('noResults').classList.remove('visible');
      document.getElementById('btnFetch').disabled = true;
      document.getElementById('btnDownload').disabled = true;

      try {
        const response = await fetch(`/fetch-logs?date=${currentDate}`);
        const data = await response.json();

        if (data.error) {
          alert('Erro: ' + data.error);
          return;
        }

        // Atualiza resumo
        document.getElementById('totalNobreaks').textContent = data.summary.total_nobreaks;
        document.getElementById('withData').textContent = data.summary.with_data;
        document.getElementById('noData').textContent = data.summary.no_data;
        document.getElementById('errors').textContent = data.summary.errors;
        document.getElementById('totalEvents').textContent = data.summary.total_events;
        document.getElementById('summary').classList.add('visible');

        // Renderiza resultados
        renderResults(data.results);

        // Habilita download se houver dados
        if (data.summary.total_events > 0) {
          document.getElementById('btnDownload').disabled = false;
        }

      } catch (error) {
        console.error('Erro ao buscar logs:', error);
        alert('Erro ao buscar logs. Verifique a conexão.');
      } finally {
        document.getElementById('loading').classList.remove('visible');
        document.getElementById('btnFetch').disabled = false;
      }
    }

    function renderResults(results) {
      const container = document.getElementById('results');
      container.innerHTML = '';

      if (results.length === 0) {
        document.getElementById('noResults').classList.add('visible');
        return;
      }

      results.forEach(result => {
        const card = document.createElement('div');
        card.className = 'nobreak-card';

        const header = document.createElement('div');
        header.className = `nobreak-header ${result.status}`;
        header.innerHTML = `
          <h3>${result.name} (${result.ip})</h3>
          <span class="event-count">${result.event_count} evento(s)</span>
        `;

        const body = document.createElement('div');
        body.className = 'nobreak-body';

        if (result.status === 'success' && result.events.length > 0) {
          result.events.forEach(event => {
            const eventItem = document.createElement('div');
            eventItem.className = 'event-item';
            eventItem.innerHTML = `
              <div class="event-time">${formatDateTime(event.data_hora)}</div>
              <div class="event-description">
                <span class="event-code">Código ${event.codigo}</span>
                <span class="event-text">${event.descricao}</span>
              </div>
            `;
            body.appendChild(eventItem);
          });
        } else {
          body.className = 'nobreak-body empty';
          if (result.status === 'no_data') {
            body.innerHTML = '<p>📭 Nenhum evento registrado nesta data</p>';
          } else if (result.status === 'offline' || result.status === 'timeout') {
            body.innerHTML = '<p>🔌 Nobreak offline ou inacessível</p>';
          } else if (result.message) {
            body.innerHTML = `<p>⚠️ ${result.message}</p>`;
          } else {
            body.innerHTML = '<p>❌ Erro ao buscar dados</p>';
          }
        }

        card.appendChild(header);
        card.appendChild(body);
        container.appendChild(card);
      });
    }

    function formatDateTime(dateTimeStr) {
      try {
        const date = new Date(dateTimeStr);
        return date.toLocaleString('pt-BR', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
      } catch {
        return dateTimeStr;
      }
    }

    function downloadReport() {
      if (!currentDate) {
        alert('Por favor, busque os logs primeiro.');
        return;
      }
      window.location.href = `/download-report?date=${currentDate}`;
    }

    // Busca logs automaticamente ao carregar a página
    // fetchLogs();
  </script>
</body>
</html>
